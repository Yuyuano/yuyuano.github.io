name: Deploy to GitHub Pages

# 由上游的 deploy.yml.example 改写而来，适配「单仓 + 本地内容」的博客：
# 不检索外部内容仓（content:sync 在 local 模式下是空操作），只做构建 + 发布。
#
# 与上游示例的差异：
#   - 去掉了内容仓 checkout / CONTENT_REPO_TOKEN / anime 快照缓存等双仓逻辑
#   - Deploy 步骤替换为 GitHub Pages 变体（upload-pages-artifact + deploy-pages）
#   - permissions 按 Pages 要求改为 contents:read + pages:write + id-token:write

on:
  push:
    # 两个分支名都列上：本地仓库是 master，而截图里 GitHub 的 CI 跑在 main 上。
    # 确认默认分支后可以只保留其中一个。
    branches: [main, master]
  workflow_dispatch:

# 只允许一个并发部署；新的推送取消进行中的部署
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9.14.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
